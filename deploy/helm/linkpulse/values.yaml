imageRegistry: ghcr.io/piliotov
imagePullSecrets: []

baseUrl: http://linkpulse.localhost

shortener:
  image:
    repository: linkpulse-shortener
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  codeLength: 7
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

analytics:
  image:
    repository: linkpulse-analytics
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  port: 8081
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

redis:
  enabled: true
  image: redis:7.4-alpine
  externalAddr: ""
  persistence:
    enabled: false
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

ingress:
  enabled: true
  className: ""
  host: linkpulse.localhost
  annotations: {}
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
