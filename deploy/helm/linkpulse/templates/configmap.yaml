apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "linkpulse.fullname" . }}
  labels:
    {{- include "linkpulse.labels" . | nindent 4 }}
data:
  REDIS_ADDR: {{ include "linkpulse.redisAddr" . | quote }}
  BASE_URL: {{ .Values.baseUrl | quote }}
  CODE_LENGTH: {{ .Values.shortener.codeLength | quote }}
