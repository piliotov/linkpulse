{{- if .Values.redis.enabled }}
{{- $ctx := dict "root" . "name" "redis" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "linkpulse.fullname" . }}-redis
  labels:
    {{- include "linkpulse.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  serviceName: {{ include "linkpulse.fullname" . }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "linkpulse.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "linkpulse.selectorLabels" $ctx | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes", "--dir", "/data"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      {{- if not .Values.redis.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "linkpulse.fullname" . }}-redis
  labels:
    {{- include "linkpulse.labels" . | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  selector:
    {{- include "linkpulse.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
