apiVersion: v1
kind: Pod
metadata:
  name: {{ include "linkpulse.fullname" . }}-test-api
  labels:
    {{- include "linkpulse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - |
          set -e
          curl -fsS http://{{ include "linkpulse.fullname" . }}-shortener:{{ .Values.shortener.port }}/readyz
          curl -fsS http://{{ include "linkpulse.fullname" . }}-analytics:{{ .Values.analytics.port }}/readyz
