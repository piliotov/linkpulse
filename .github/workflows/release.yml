name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    name: image (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [shortener, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/linkpulse-${{ matrix.service }}
          tags: |
            type=sha,prefix=,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: kind
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: linkpulse
      - name: Pull released images
        run: |
          for svc in shortener analytics; do
            docker pull "$REGISTRY/linkpulse-$svc:$GITHUB_SHA"
          done
      - name: Deploy
        run: ./scripts/kind-deploy.sh
        env:
          BUILD: "false"
          TAG: ${{ github.sha }}
      - name: Smoke test
        run: |
          kubectl port-forward svc/linkpulse-shortener 8080:8080 &
          kubectl port-forward svc/linkpulse-analytics 8081:8081 &
          sleep 3
          ./scripts/smoke.sh
      - run: helm test linkpulse
      - name: Rolling update
        run: |
          kubectl rollout restart deployment/linkpulse-shortener
          kubectl rollout status deployment/linkpulse-shortener --timeout=2m

  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Push chart to GHCR
        run: |
          version=${GITHUB_REF_NAME#v}
          helm package deploy/helm/linkpulse --version "$version" --app-version "$version"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "linkpulse-$version.tgz" "oci://$REGISTRY/charts"
