version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/services/shortener", "/services/analytics"]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/services/shortener", "/services/analytics"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
